# Optional hardening overlay: read the API key from a Docker secret FILE instead
# of an environment variable, so it never appears in the container's env or in
# `docker inspect`. Prefer this on shared/multi-tenant hosts.
#
# Setup:
#   cp secrets/gemini_api_key.txt.example secrets/gemini_api_key.txt
#   printf '%s' 'YOUR_GOOGLE_AI_STUDIO_KEY' > secrets/gemini_api_key.txt
#   chmod 700 secrets && chmod 444 secrets/gemini_api_key.txt
#
# Run (note both -f files):
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d --build
services:
  backend:
    environment:
      GEMINI_API_KEY: "" # ensure the file (below) is authoritative, not the env var
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
    secrets:
      # Compose (non-Swarm) preserves the host file's ownership/permissions, so
      # the chmod above matters: dir 700 blocks other host users; the file's read
      # bit lets the image's non-root user read the mount. (uid/gid/mode fields
      # here would only take effect under Docker Swarm.)
      - gemini_api_key

secrets:
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt
